name: Windows/Ubuntu/MacOS

on:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    env:
      CMAKE_POLICY_VERSION_MINIMUM: ${{ matrix.os == 'ubuntu-latest' && '3.5' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        id: build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Find executable files
        id: binaries
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--no-deps", "--format-version", "1"
          ]))

          extension = ".exe" if os.name == "nt" else ""
          binaries = []

          for package in metadata["packages"]:
              for target in package["targets"]:
                  if "bin" in target["kind"]:
                      path = os.path.join(
                          "target", "debug", target["name"] + extension
                      )
                      if os.path.isfile(path):
                          binaries.append(path)

          if not binaries:
              raise SystemExit("No executable files found")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("paths<<EOF\n")
              output.write("\n".join(binaries) + "\n")
              output.write("EOF\n")

          print("Found binaries:")
          for binary in binaries:
              print(binary)
          PY

      - name: Upload build artifacts
        if: always() && steps.build.outcome == 'success' && steps.binaries.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Aida64-Keys-${{ matrix.os }}
          path: ${{ steps.binaries.outputs.paths }}
          if-no-files-found: error
          retention-days: 30
